<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDIプレイヤー</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090c;--panel:#131318;--line:#383844;--tx:#e0e0ea;--dim:#80808f;--c0:#ff4d4d;--c1:#ffb000;--c2:#3dff9a;--c3:#b4b8ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'DotGothic16',ui-monospace,Menlo,Consolas,monospace;font-size:15px;display:flex;flex-direction:column;gap:10px;padding:12px}
body.drag{outline:3px dashed var(--c2);outline-offset:-6px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--line);padding-bottom:8px}
h1{margin:0;font-size:24px;font-weight:400;letter-spacing:.04em}
.sub{color:var(--dim)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;color:var(--tx);background:var(--panel);border:2px solid var(--line);padding:8px 14px;cursor:pointer;line-height:1.2;user-select:none}
button:hover,.btn:hover{border-color:var(--tx)}
button:active,.btn:active{background:var(--tx);color:var(--bg)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
#pp{min-width:104px;border-color:var(--tx)}
#lp[aria-pressed=true]{border-color:var(--c2);color:var(--c2)}
#tm{font-variant-numeric:tabular-nums;min-width:112px;text-align:center;border:2px solid var(--line);padding:8px 10px;background:var(--panel)}
.vol{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--dim)}
.vol input{width:110px}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:linear-gradient(90deg,var(--tx) var(--p,0%),var(--panel) var(--p,0%));border:2px solid var(--line);margin:0;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:24px;background:var(--tx);border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:10px;height:24px;background:var(--tx);border:2px solid var(--bg);border-radius:0}
#info{color:var(--dim);min-height:1.3em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.voices{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:2px solid var(--line)}
.voices button{border:0;border-right:2px solid var(--line);padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.voices button:last-child{border-right:0}
.voices i{width:12px;height:12px;background:var(--c);flex:none}
.voices button[aria-pressed=false]{color:var(--dim)}
.voices button[aria-pressed=false] i{background:none;border:2px solid var(--dim)}
.voices button[aria-pressed=true]{box-shadow:inset 0 -4px 0 var(--c)}
canvas{flex:1;min-height:240px;width:100%;display:block;border:2px solid var(--line);background:var(--bg)}
@media (max-width:560px){.vol{margin-left:0;width:100%}.vol input{flex:1}.voices button{font-size:12px;gap:4px}}
</style>
</head>
<body>
<header><h1>MIDIプレイヤー</h1><span class="sub">矩形波×2 / 三角波×1 / ノイズ×1 のチップチューン再生</span></header>
<div class="bar">
  <button id="pp">▶ 再生</button>
  <button id="st">■ 停止</button>
  <button id="lp" aria-pressed="true">ループ</button>
  <label class="btn">MIDIを開く<input type="file" id="f" accept=".mid,.midi,audio/midi,audio/x-midi" hidden></label>
  <button id="dm">デモ曲</button>
  <span id="tm">00:00 / 00:00</span>
  <label class="vol">音量<input type="range" id="vol" min="0" max="100" value="80"></label>
</div>
<input type="range" id="sk" min="0" max="1000" value="0" aria-label="再生位置">
<div id="info"></div>
<div class="voices" id="vs"></div>
<canvas id="cv"></canvas>

<script>
const $=s=>document.querySelector(s);
const VN=['矩形波 1','矩形波 2','三角波','ノイズ'],VC=['#ff4d4d','#ffb000','#3dff9a','#b4b8ff'];
let notes=[],dur=0,rng=[],ctx,master,vg=[],waves=[],nbuf,playing=false,startAt=0,pausedPos=0,nextI=0,timer,mute=[0,0,0,0],vol=.8,loopOn=true,seeking=false;

/* ---------- MIDI ---------- */
function parseMidi(buf){
  const d=new DataView(buf);let p=0;
  const str=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(d.getUint8(p++));return s};
  if(str(4)!=='MThd')throw new Error('MIDIファイルではありません');
  const hl=d.getUint32(p);p+=4;const nt=d.getUint16(p+2),div=d.getUint16(p+4);p+=hl;
  if(div&0x8000)throw new Error('SMPTE形式のMIDIには未対応です');
  const tempos=[{tick:0,us:500000}],nm=[];
  for(let t=0;t<nt&&p+8<=d.byteLength;t++){
    const id=str(4),len=d.getUint32(p);p+=4;const end=Math.min(p+len,d.byteLength);
    if(id!=='MTrk'){p=end;continue}
    let tick=0,rs=0;const on={};
    const vl=()=>{let v=0,b;do{b=d.getUint8(p++);v=(v<<7)|(b&127)}while(b&128);return v};
    while(p<end){
      tick+=vl();let s=d.getUint8(p);
      if(s<128)s=rs;else{p++;if(s<240)rs=s}
      if(s===255){const ty=d.getUint8(p++),l=vl();if(ty===0x51&&l===3)tempos.push({tick,us:d.getUint8(p)<<16|d.getUint8(p+1)<<8|d.getUint8(p+2)});p+=l}
      else if(s===240||s===247){p+=vl()}
      else{
        const h=s>>4,ch=s&15,a=d.getUint8(p++),b=(h===12||h===13)?0:d.getUint8(p++);
        if(h===9&&b>0){(on[ch*128+a]=on[ch*128+a]||[]).push({tick,b})}
        else if(h===8||h===9){const q=on[ch*128+a];if(q&&q.length){const o=q.shift();nm.push({a:o.tick,z:tick,ch,n:a,vel:o.b})}}
      }
    }
    for(const k in on)for(const o of on[k])nm.push({a:o.tick,z:tick,ch:k>>7,n:k&127,vel:o.b});
    p=end;
  }
  tempos.sort((x,y)=>x.tick-y.tick);
  tempos.forEach((m,i)=>{m.sec=i?tempos[i-1].sec+(m.tick-tempos[i-1].tick)*tempos[i-1].us/1e6/div:0});
  const ts=k=>{let m=tempos[0];for(const x of tempos){if(x.tick<=k)m=x;else break}return m.sec+(k-m.tick)*m.us/1e6/div};
  return nm.map(n=>({t:ts(n.a),d:ts(n.z)-ts(n.a),ch:n.ch,n:n.n,vel:n.vel}));
}

/* 4音(矩形波1/2・三角波・ノイズ)へ割り当て */
function assign(raw){
  const mel=raw.filter(n=>n.ch!==9),dr=raw.filter(n=>n.ch===9),st={};
  mel.forEach(n=>{const o=st[n.ch]=st[n.ch]||{s:0,c:0};o.s+=n.n;o.c++});
  const chs=Object.keys(st).sort((a,b)=>st[b].s/st[b].c-st[a].s/st[a].c),pref={};
  chs.forEach((c,i)=>pref[c]=chs.length===1||i===0?0:i===chs.length-1?2:1);
  mel.sort((a,b)=>a.t-b.t||b.n-a.n);
  const end=[-1,-1,-1],out=[];
  for(const n of mel){
    const pv=pref[n.ch],order=pv===0?[0,1,2]:pv===1?[1,0,2]:[2,1,0];
    const v=order.find(x=>end[x]<=n.t+.004);
    if(v===undefined)continue;
    const d=Math.max(.05,n.d);end[v]=n.t+d;out.push({t:n.t,d,p:n.n,v,vel:n.vel});
  }
  dr.forEach(n=>{
    const k=[35,36].includes(n.n)?0:[37,38,39,40].includes(n.n)?1:[42,44,46,49,51,53,57,59].includes(n.n)?2:3;
    out.push({t:n.t,d:.1,p:k,k,v:3,vel:n.vel});
  });
  return out.sort((a,b)=>a.t-b.t);
}

function demo(){
  const s=60/150/2,o=[],ch=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bs=[45,41,48,43];
  const A=[76,0,79,76,81,0,79,76,77,0,81,77,84,0,81,77,76,0,79,76,84,0,83,79,79,0,83,79,86,0,83,79];
  const B=[81,79,76,79,81,84,81,79,77,76,72,76,77,81,77,76,76,79,84,79,76,79,83,79,79,83,86,83,79,83,88,86];
  for(let b=0;b<16;b++)for(let i=0;i<8;i++){
    const t=(b*8+i)*s,c=ch[b%4],M=((b>>2)&1?B:A)[(b%4)*8+i];
    if(M)o.push({t,d:s*.9,ch:0,n:M,vel:105});
    o.push({t,d:s*.9,ch:1,n:c[[0,1,2,1,0,1,2,1][i]]+(b>=8?12:0),vel:80});
    o.push({t,d:s*.9,ch:2,n:bs[b%4]+(i%4===2?12:0)-12+12,vel:110});
    if(i===0||i===4)o.push({t,d:s,ch:9,n:36,vel:120});
    if(i===2||i===6)o.push({t,d:s,ch:9,n:38,vel:110});
    if(i%2)o.push({t,d:s*.4,ch:9,n:42,vel:80});
  }
  return o;
}

function setSong(raw,name){
  stop();notes=assign(raw);dur=notes.reduce((m,n)=>Math.max(m,n.t+n.d),0);
  rng=[0,1,2,3].map(v=>{
    if(v===3)return{lo:0,hi:3};
    const ps=notes.filter(n=>n.v===v).map(n=>n.p);
    if(!ps.length)return{lo:48,hi:72};
    let lo=Math.min(...ps)-1,hi=Math.max(...ps)+1;
    if(hi-lo<14){const m=(hi+lo)>>1;lo=m-7;hi=m+7}
    return{lo,hi};
  });
  $('#info').textContent=name+'  /  ノート '+notes.length;
}

/* ---------- 音 ---------- */
function pw(d){
  const N=48,re=new Float32Array(N),im=new Float32Array(N);
  for(let n=1;n<N;n++){re[n]=Math.sin(2*Math.PI*n*d)/(n*Math.PI);im[n]=(1-Math.cos(2*Math.PI*n*d))/(n*Math.PI)}
  return ctx.createPeriodicWave(re,im);
}
function initAudio(){
  if(ctx)return;
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  waves=[pw(.25),pw(.5)];
  nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()<.5?-1:1;
}
function build(){
  if(master)master.disconnect();
  master=ctx.createGain();master.gain.value=vol;master.connect(ctx.destination);
  vg=[0,1,2,3].map(i=>{const g=ctx.createGain();g.gain.value=mute[i]?0:1;g.connect(master);return g});
}
function sched(n,w){
  const v=n.v,out=vg[v],vel=n.vel/127;
  if(v===3){
    const s=ctx.createBufferSource(),g=ctx.createGain(),L=[.16,.13,.05,.1][n.k];
    s.buffer=nbuf;s.loop=true;s.playbackRate.value=[.1,.6,1.8,.9][n.k];
    const A=.2*(.5+vel/2);g.gain.setValueAtTime(A,w);g.gain.exponentialRampToValueAtTime(.001,w+L);
    s.connect(g);g.connect(out);s.start(w);s.stop(w+L+.02);return;
  }
  const o=ctx.createOscillator(),g=ctx.createGain(),e=w+n.d;
  if(v===2)o.type='triangle';else o.setPeriodicWave(waves[v]);
  o.frequency.value=440*2**((n.p-69)/12);
  const A=(v===2?.45:.15)*(.4+.6*vel),dec=Math.max(.01,Math.min(.12,n.d));
  const sus=v<2?A*(1-.35*dec/.12):A;
  g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(A,w+.004);
  if(v<2)g.gain.linearRampToValueAtTime(sus,w+dec);
  g.gain.setValueAtTime(sus,e);g.gain.linearRampToValueAtTime(0,e+.02);
  o.connect(g);g.connect(out);o.start(w);o.stop(e+.03);
}
function pump(){
  const now=ctx.currentTime;
  while(nextI<notes.length&&notes[nextI].t+startAt<now+.25){
    const n=notes[nextI++],w=n.t+startAt;
    if(w>=now-.02)sched(n,Math.max(w,now));
  }
}
const getPos=()=>Math.max(0,Math.min(dur,playing?ctx.currentTime-startAt:pausedPos));
function play(from){
  if(!notes.length)return;
  initAudio();ctx.resume();build();
  from=from||0;startAt=ctx.currentTime-from+.06;
  nextI=notes.findIndex(n=>n.t>=from);if(nextI<0)nextI=notes.length;
  playing=true;clearInterval(timer);timer=setInterval(pump,30);pump();
  $('#pp').textContent='❚❚ 一時停止';
}
function pause(){
  if(!playing)return;
  pausedPos=getPos();playing=false;clearInterval(timer);
  if(master)master.disconnect();
  $('#pp').textContent='▶ 再生';
}
function stop(){pause();pausedPos=0;$('#pp').textContent='▶ 再生'}
function seek(p){if(playing)play(p);else pausedPos=p}

/* ---------- 描画 ---------- */
const cv=$('#cv'),g=cv.getContext('2d'),LOOK=2.4;
function draw(){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle='#09090c';g.fillRect(0,0,W,H);
  const hitY=H-30,pos=getPos(),cw=W/4;
  for(let t=Math.ceil(pos*2)/2;t<pos+LOOK;t+=.5){
    const y=Math.round(hitY-(t-pos)/LOOK*hitY);
    g.fillStyle=Number.isInteger(t)?'#262630':'#16161c';g.fillRect(0,y,W,1);
  }
  g.fillStyle='#2a2a34';for(let i=1;i<4;i++)g.fillRect(Math.round(i*cw)-1,0,2,H);
  g.fillStyle='#131318';g.fillRect(0,hitY+4,W,H-hitY-4);
  const act=[];
  for(const n of notes){
    if(n.t>pos+LOOK)break;
    if(n.t+n.d<pos-.02)continue;
    const r=rng[n.v],span=r.hi-r.lo+1,nw=(cw-8)/span;
    const x=Math.round(n.v*cw+4+(n.p-r.lo)*nw),w=Math.max(3,Math.round(nw)-1);
    const yb=Math.min(hitY,hitY-(n.t-pos)/LOOK*hitY),yt=hitY-(n.t+n.d-pos)/LOOK*hitY;
    const h=Math.max(5,yb-yt),on=n.t<=pos&&pos<n.t+n.d;
    g.globalAlpha=mute[n.v]?.18:1;
    g.fillStyle=on?'#fff':VC[n.v];g.fillRect(x,Math.round(yb-h),w,Math.round(h));
    if(on){g.strokeStyle=VC[n.v];g.lineWidth=2;g.strokeRect(x+1,Math.round(yb-h)+1,w-2,Math.round(h)-2);if(!mute[n.v])act.push([x,w,n.v])}
    g.globalAlpha=1;
  }
  for(let v=0;v<4;v++){g.fillStyle=mute[v]?'#383844':VC[v];g.fillRect(Math.round(v*cw)+2,hitY,Math.round(cw)-4,3)}
  for(const[x,w,v]of act){g.fillStyle=VC[v];g.fillRect(x,hitY+6,w,H-hitY-8)}
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function ui(){
  const pos=getPos();
  if(playing&&pos>=dur+.3){loopOn?play(0):stop()}
  $('#tm').textContent=fmt(pos)+' / '+fmt(dur);
  if(!seeking){const sk=$('#sk'),v=dur?pos/dur*1000:0;sk.value=v;sk.style.setProperty('--p',v/10+'%')}
}
(function loop(){draw();ui();requestAnimationFrame(loop)})();

/* ---------- 操作 ---------- */
$('#vs').innerHTML=VN.map((n,i)=>'<button aria-pressed="true" data-v="'+i+'" style="--c:'+VC[i]+'"><i></i>'+n+'</button>').join('');
$('#vs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const v=+b.dataset.v;mute[v]=mute[v]?0:1;
  b.setAttribute('aria-pressed',mute[v]?'false':'true');
  if(vg[v])vg[v].gain.value=mute[v]?0:1;
});
$('#pp').onclick=()=>playing?pause():play(pausedPos>=dur?0:pausedPos);
$('#st').onclick=stop;
$('#lp').onclick=e=>{loopOn=!loopOn;e.currentTarget.setAttribute('aria-pressed',loopOn)};
$('#dm').onclick=()=>setSong(demo(),'デモ曲');
const sk=$('#sk');
sk.addEventListener('input',()=>{seeking=true;sk.style.setProperty('--p',sk.value/10+'%');if(!playing)pausedPos=sk.value/1000*dur});
sk.addEventListener('change',()=>{seeking=false;seek(sk.value/1000*dur)});
const vo=$('#vol');
vo.addEventListener('input',()=>{vol=vo.value/100;vo.style.setProperty('--p',vo.value+'%');if(master)master.gain.value=vol});
vo.style.setProperty('--p','80%');
async function openFile(f){
  if(!f)return;
  try{setSong(parseMidi(await f.arrayBuffer()),f.name);play(0)}
  catch(err){$('#info').textContent='読み込めませんでした: '+err.message+'(.mid / .midi ファイルを選んでください)'}
}
$('#f').onchange=e=>{openFile(e.target.files[0]);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');openFile(e.dataTransfer.files[0])});
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('#pp').click()}});
setSong(demo(),'デモ曲(MIDIファイルを開くか、ここにドロップ)');
</script>
</body>
</html>
