<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>電子署名</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: single column. Input on top, then three result fields (signature, public key, private key) with copy buttons. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --sunken:#e9eef5; --fg:#16202f; --muted:#56627a; --line:#d3dbe7;
  --accent:#2a3f9c; --accent-fg:#ffffff;
  --ok:#146c43; --ng:#a8231b; --ng-bg:#fbe6e3; --warn:#7a5200; --warn-bg:#fff0d0;
  --font-display:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --font-body:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --surface:#171e2d; --sunken:#1f2839; --fg:#e6ebf5; --muted:#9aa6bd; --line:#2b364b;
    --accent:#8fa4ff; --accent-fg:#0f1420;
    --ok:#5cd39a; --ng:#ff8a80; --ng-bg:#3a1815; --warn:#f2c261; --warn-bg:#33270d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --surface:#171e2d; --sunken:#1f2839; --fg:#e6ebf5; --muted:#9aa6bd; --line:#2b364b;
  --accent:#8fa4ff; --accent-fg:#0f1420;
  --ok:#5cd39a; --ng:#ff8a80; --ng-bg:#3a1815; --warn:#f2c261; --warn-bg:#33270d;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.7;
  padding-block:32px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:24px}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);margin-top:8px}
.field{display:grid;gap:8px;min-width:0}
.lbl-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-weight:700;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--ng-bg);color:var(--ng)}

textarea{
  width:100%;display:block;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:6px;padding:10px 12px;font:inherit;line-height:1.6;resize:vertical;min-width:0;
}
textarea.mono{font-family:var(--font-mono);font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken)}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 18px;
  border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font:inherit;font-weight:500;cursor:pointer;
}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.small{min-height:32px;padding:4px 12px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.msg{font-size:13px;color:var(--ng)}
.msg:empty{display:none}
.notes{background:var(--warn-bg);color:var(--warn);padding:12px 16px;border-radius:6px;font-size:14px}
#results{display:grid;gap:22px}

@media (max-width:480px){ h1{font-size:24px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>電子署名ツール</h1>

  <div id="nocrypto" class="notes" hidden>このブラウザ環境では暗号機能が使えません。別のブラウザで開いてください。</div>

  <div class="field">
    <label class="lbl" for="text">署名するテキスト</label>
    <textarea id="text" rows="5" spellcheck="false" placeholder="署名したいテキストを入力してください"></textarea>
    <div class="row">
      <button type="button" class="btn primary" id="run">署名する</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </div>

  <div id="results" hidden>
    <div class="field">
      <label class="lbl" for="sig">署名</label>
      <textarea id="sig" class="mono" rows="3" readonly spellcheck="false"></textarea>
      <div class="row"><button type="button" class="btn small" data-copy="sig">コピー</button></div>
    </div>

    <div class="field">
      <label class="lbl" for="pub">公開鍵</label>
      <textarea id="pub" class="mono" rows="6" readonly spellcheck="false"></textarea>
      <div class="row"><button type="button" class="btn small" data-copy="pub">コピー</button></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var enc = new TextEncoder();
  var subtle = (window.crypto && window.crypto.subtle) || null;
  var ALG = { name: 'ECDSA', namedCurve: 'P-256' };
  var SIG = { name: 'ECDSA', hash: 'SHA-256' };

  function b64(buf) {
    var u = new Uint8Array(buf), s = '';
    for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function toPem(buf, label) {
    return '-----BEGIN ' + label + '-----\n' + b64(buf).match(/.{1,64}/g).join('\n') + '\n-----END ' + label + '-----';
  }

  async function run() {
    var text = $('text').value;
    $('msg').textContent = '';
    if (!text) { $('msg').textContent = 'テキストを入力してください。'; return; }
    try {
      var kp = await subtle.generateKey(ALG, true, ['sign', 'verify']);
      var sig = await subtle.sign(SIG, kp.privateKey, enc.encode(text));
      $('sig').value = b64(sig);
      $('pub').value = toPem(await subtle.exportKey('spki', kp.publicKey), 'PUBLIC KEY');
      $('results').hidden = false;
    } catch (e) {
      $('results').hidden = true;
      $('msg').textContent = '署名に失敗しました。もう一度お試しください。';
    }
  }

  async function copyFrom(btn, id) {
    var el = $(id), label = btn.dataset.label || btn.textContent, done = false;
    btn.dataset.label = label;
    try { await navigator.clipboard.writeText(el.value); done = true; }
    catch (e) { try { el.focus(); el.select(); done = document.execCommand('copy'); } catch (e2) {} }
    btn.textContent = done ? 'コピーしました' : '選択しました。コピーしてください';
    setTimeout(function () { btn.textContent = label; }, 1800);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('button[data-copy]');
    if (t) copyFrom(t, t.dataset.copy);
  });
  $('run').addEventListener('click', run);
  $('text').addEventListener('input', function () { $('results').hidden = true; $('msg').textContent = ''; });

  if (!subtle) { $('nocrypto').hidden = false; $('run').disabled = true; }
})();
</script>

</body></html>
